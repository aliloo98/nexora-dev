name: Supabase CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: supabase-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  database-and-app:
    name: Ephemeral database and application checks
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      CI: "true"
      DO_NOT_TRACK: "1"
      SUPABASE_TELEMETRY_DISABLED: "1"
      VITE_SUPABASE_ANON_KEY: ""
      VITE_SUPABASE_URL: ""

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js 20
        uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm

      - name: Get Playwright cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Install locked npm dependencies
        run: npm ci
        timeout-minutes: 5

      - name: Install Supabase CLI 2.109.1
        uses: supabase/setup-cli@v3
        with:
          version: 2.109.1

      - name: Verify toolchain and Docker
        run: |
          echo "Node.js $(node --version)"
          echo "npm $(npm --version)"
          echo "Supabase CLI $(supabase --version)"
          docker info --format 'Docker server version: {{.ServerVersion}}'
        timeout-minutes: 2

      - name: Validate local Supabase layout and CI safety gates
        run: npm run test:supabase:layout
        timeout-minutes: 2

      - name: Start ephemeral Supabase stack
        run: |
          echo "Starting the isolated Supabase stack..."
          start_output="$RUNNER_TEMP/supabase-start.json"
          trap 'rm -f "$start_output"' EXIT
          supabase start --output json > "$start_output"
          echo "Supabase stack started successfully."
        timeout-minutes: 12

      - name: Discover local mail service
        run: |
          echo "MAIL_DISCOVERY: Discovering local mail service contract..."
          
          echo "MAIL_DISCOVERY: Testing root endpoint..."
          ROOT_STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:54324/ || echo "000")
          ROOT_TYPE=$(curl -s -I http://127.0.0.1:54324/ 2>/dev/null | grep -i content-type | cut -d' ' -f2 | tr -d '\r' || echo "unknown")
          echo "MAIL_DISCOVERY root status=$ROOT_STATUS type=$ROOT_TYPE"
          
          echo "MAIL_DISCOVERY: Testing /api/v1/ endpoint..."
          API_V1_STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:54324/api/v1/ || echo "000")
          API_V1_TYPE=$(curl -s -I http://127.0.0.1:54324/api/v1/ 2>/dev/null | grep -i content-type | cut -d' ' -f2 | tr -d '\r' || echo "unknown")
          echo "MAIL_DISCOVERY api_v1 status=$API_V1_STATUS type=$API_V1_TYPE"
          
          echo "MAIL_DISCOVERY: Testing /api/v1/messages endpoint..."
          MESSAGES_STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:54324/api/v1/messages || echo "000")
          MESSAGES_TYPE=$(curl -s -I http://127.0.0.1:54324/api/v1/messages 2>/dev/null | grep -i content-type | cut -d' ' -f2 | tr -d '\r' || echo "unknown")
          echo "MAIL_DISCOVERY messages status=$MESSAGES_STATUS type=$MESSAGES_TYPE"
          
          if [ "$MESSAGES_STATUS" = "200" ] && [ "$MESSAGES_TYPE" = "application/json" ]; then
            echo "MAIL_DISCOVERY messages_schema=$(curl -s http://127.0.0.1:54324/api/v1/messages 2>/dev/null | jq -r 'if type == "array" then "array length=\(length)" else "keys=\(keys | join(","))" end' || echo "unknown")"
          fi
          
          echo "MAIL_DISCOVERY: Testing /api/ endpoint..."
          API_STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:54324/api/ || echo "000")
          API_TYPE=$(curl -s -I http://127.0.0.1:54324/api/ 2>/dev/null | grep -i content-type | cut -d' ' -f2 | tr -d '\r' || echo "unknown")
          echo "MAIL_DISCOVERY api status=$API_STATUS type=$API_TYPE"
          
          echo "MAIL_DISCOVERY: Discovery completed."
        timeout-minutes: 1

      - name: Rebuild database from versioned migrations
        run: |
          echo "Resetting the local database and applying every migration..."
          supabase db reset --local --no-seed
          echo "Database reconstruction completed."
        timeout-minutes: 5

      - name: Lint database schema
        run: |
          echo "Running SQL lint with warnings treated as failures..."
          supabase db lint --local --level warning --fail-on warning
          echo "SQL lint completed successfully."
        timeout-minutes: 3

      - name: Run pgTAP and RLS tests
        run: |
          echo "Running transactional pgTAP and RLS tests..."
          supabase test db --local
          echo "Database tests completed successfully."
        timeout-minutes: 5

      - name: Run all Node.js tests
        run: npm run test:js
        timeout-minutes: 5

      - name: Install Chromium for Playwright
        run: npx --no-install playwright install --with-deps chromium
        timeout-minutes: 20

      - name: Run Playwright application tests
        run: npm run test:e2e
        timeout-minutes: 15

      - name: Run real Supabase E2E certification
        run: |
          echo "Extracting Supabase connection details for E2E certification..."
          status_output="$RUNNER_TEMP/supabase-status.json"
          supabase status -o json > "$status_output"

          # Extract API URL and anon key (keys are uppercase in supabase status JSON)
          SUPABASE_URL=$(jq -r '.API_URL // empty' "$status_output")
          SUPABASE_ANON_KEY=$(jq -r '.ANON_KEY // empty' "$status_output")
          SUPABASE_SERVICE_ROLE_KEY=$(jq -r '.SERVICE_ROLE_KEY // empty' "$status_output")

          echo "Supabase connection details extracted."
          echo "URL: $SUPABASE_URL"
          echo "Anon key present: $([ -n "$SUPABASE_ANON_KEY" ] && echo yes || echo no)"
          echo "Service role present: $([ -n "$SUPABASE_SERVICE_ROLE_KEY" ] && echo yes || echo no)"

          # Initialize diagnostics file
          DIAG="$RUNNER_TEMP/supabase-e2e-diagnostics.txt"
          echo "=== SUPABASE E2E DIAGNOSTICS ===" > "$DIAG"
          echo "Git SHA: $(git rev-parse HEAD)" >> "$DIAG"
          echo "Supabase URL present: $([ -n "$SUPABASE_URL" ] && echo yes || echo no)" >> "$DIAG"
          echo "Anon key present: $([ -n "$SUPABASE_ANON_KEY" ] && echo yes || echo no)" >> "$DIAG"
          echo "Service role present: $([ -n "$SUPABASE_SERVICE_ROLE_KEY" ] && echo yes || echo no)" >> "$DIAG"

          echo "E2E_DISCOVERY: Listing tests from dedicated Supabase config..." | tee -a "$DIAG"
          VITE_SUPABASE_URL="$SUPABASE_URL" \
          VITE_SUPABASE_ANON_KEY="$SUPABASE_ANON_KEY" \
          SUPABASE_SERVICE_ROLE_KEY="$SUPABASE_SERVICE_ROLE_KEY" \
          npx playwright test --list --config=./playwright.config.supabase.js 2>&1 | tee -a "$DIAG" || echo "E2E_DISCOVERY: Test list failed" | tee -a "$DIAG"
          LIST_EXIT=${PIPESTATUS[0]}
          echo "Playwright --list exit code: $LIST_EXIT" >> "$DIAG"

          echo "E2E_DISCOVERY: Checking Vite port before execution..." | tee -a "$DIAG"
          curl --fail --silent --show-error http://127.0.0.1:5173/ >/dev/null 2>&1 && echo "E2E_DISCOVERY: Port 5173 reachable" | tee -a "$DIAG" || echo "E2E_DISCOVERY: Port 5173 not reachable (expected before webServer starts)" | tee -a "$DIAG"

          echo "Running real Supabase E2E certification..." | tee -a "$DIAG"
          set -o pipefail
          VITE_SUPABASE_URL="$SUPABASE_URL" \
          VITE_SUPABASE_ANON_KEY="$SUPABASE_ANON_KEY" \
          SUPABASE_SERVICE_ROLE_KEY="$SUPABASE_SERVICE_ROLE_KEY" \
          npm run test:e2e:supabase 2>&1 | tee -a "$DIAG"
          E2E_EXIT=${PIPESTATUS[0]}
          echo "Playwright E2E exit code: $E2E_EXIT" >> "$DIAG"
          exit "$E2E_EXIT"
        timeout-minutes: 15

      - name: Upload Playwright diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-diagnostics
          path: |
            ${{ runner.temp }}/supabase-e2e-diagnostics.txt
            playwright-report/
            test-results/
          retention-days: 7

      - name: Build Vite production bundle
        run: npm run build
        timeout-minutes: 5

      - name: Stop ephemeral Supabase stack
        if: always()
        continue-on-error: true
        run: |
          echo "Stopping and deleting the ephemeral Supabase stack..."
          supabase stop --project-id nexora-dev --no-backup
          echo "Supabase cleanup completed."
        timeout-minutes: 5
