name: Release Validation

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-validation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release-validation:
    name: Production-like demo validation
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CI: "true"
      DO_NOT_TRACK: "1"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Get Playwright cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Install locked npm dependencies
        run: npm ci
        timeout-minutes: 5

      - name: Install Chromium for Playwright
        run: npx --no-install playwright install --with-deps chromium
        timeout-minutes: 20

      - name: Run JavaScript tests
        run: npm run test:js
        timeout-minutes: 5

      - name: Run architecture gates
        run: npm run architecture:check
        timeout-minutes: 5

      - name: Build demo build
        run: npm run build:demo
        timeout-minutes: 10
        env:
          VITE_SUPABASE_URL: ""
          VITE_SUPABASE_ANON_KEY: ""

      - name: Run demo validation tests
        run: npx playwright test tests/playwright/release-validation.demo.spec.js --config=./playwright.config.release.js
        timeout-minutes: 10

      - name: Build normal build (empty Supabase)
        run: npm run build
        timeout-minutes: 10
        env:
          VITE_SUPABASE_URL: ""
          VITE_SUPABASE_ANON_KEY: ""

      - name: Run normal validation tests (empty Supabase)
        run: npx playwright test tests/playwright/release-validation.normal.spec.js --config=./playwright.config.release.js
        timeout-minutes: 10

      - name: Build normal build (synthetic Supabase)
        run: npm run build
        timeout-minutes: 10
        env:
          VITE_SUPABASE_URL: "https://synthetic.supabase.co"
          VITE_SUPABASE_ANON_KEY: "synthetic_anon_key"

      - name: Run normal validation tests (synthetic Supabase)
        run: npx playwright test tests/playwright/release-validation.normal-supabase.spec.js --config=./playwright.config.release.js
        timeout-minutes: 10

      - name: Upload Playwright diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-release-diagnostics
          path: |
            playwright-report
            test-results
            **/trace.zip
            **/*.webm
            **/*.png
          retention-days: 7